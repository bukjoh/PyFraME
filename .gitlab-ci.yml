test-3.7:
    image: python:3.7
    script:
        - pip install --upgrade pip
        - pip install numpy
        - pip install numba
        - pip install pytest
        - py.test

test-3.6:
    image: python:3.6
    script:
        - pip install --upgrade pip
        - pip install numpy
        - pip install numba
        - pip install pytest
        - pip install pytest-cov
        - NUMBA_DISABLE_JIT=1 pytest --cov-config .coveragerc --cov-fail-under=50 --cov-report term-missing --cov=pyframe

test-3.5:
    image: python:3.5
    script:
        - pip install --upgrade pip
        - pip install numpy
        - pip install numba
        - pip install pytest
        - py.test

code_quality:
    image: docker:stable
    variables:
        DOCKER_DRIVER: overlay2
    allow_failure: true
    services:
        - docker:stable-dind
    script:
        - export SP_VERSION=$(echo "$CI_SERVER_VERSION" | sed 's/^\([0-9]*\)\.\([0-9]*\).*/\1-\2-stable/')
        - docker run
            --env SOURCE_CODE="$PWD"
            --volume "$PWD":/code
            --volume /var/run/docker.sock:/var/run/docker.sock
            "registry.gitlab.com/gitlab-org/security-products/codequality:$SP_VERSION" /code
    artifacts:
        paths: [gl-code-quality-report.json]
