test-3.6:
    image: python:3.6
    script:
        - pip install --upgrade pip
        - pip install numpy
        - pip install numba
        - pip install nose
        - pip install coverage
        - pip install codacy-coverage
        - NUMBA_DISABLE_JIT=1 nosetests --with-coverage --cover-erase --cover-xml --cover-package=pyframe
        - python-codacy-coverage -r tests/coverage.xml

test-3.5:
    image: python:3.5
    script:
        - pip install --upgrade pip
        - pip install numpy
        - pip install numba
        - pip install nose
        - nosetests

codequality:
  image: docker:latest
  variables:
    DOCKER_DRIVER: overlay
  services:
    - docker:dind
  script:
    - docker pull codeclimate/codeclimate
    - docker run --env CODECLIMATE_CODE="$PWD" --volume "$PWD":/code --volume /var/run/docker.sock:/var/run/docker.sock --volume /tmp/cc:/tmp/cc codeclimate/codeclimate init
    - docker run --env CODECLIMATE_CODE="$PWD" --volume "$PWD":/code --volume /var/run/docker.sock:/var/run/docker.sock --volume /tmp/cc:/tmp/cc codeclimate/codeclimate analyze -f json > codeclimate.json
  artifacts:
    paths: [codeclimate.json]
