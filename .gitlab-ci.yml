stages:
    - test
    - analysis

test-3.7:
    stage: test
    image: python:3.7
    script:
        - pip install --upgrade pip
        - pip install numpy
        - pip install numba
        - pip install pytest
        - py.test

test-3.6:
    stage: test
    image: python:3.6
    script:
        - pip install --upgrade pip
        - pip install numpy
        - pip install numba
        - pip install pytest
        - pip install pytest-cov
        - NUMBA_DISABLE_JIT=1 pytest --cov-config .coveragerc --cov-fail-under=50 --cov-report term-missing --cov=pyframe
    artifacts:
        paths:
            - .coverage

codecov:
    stage: analysis
    image: python:3.6
    retry: 2
    allow_failure: true
    script:
        - pip install coverage
        - bash <(curl -s https://codecov.io/bash) -t 5c2b4cbc-5626-4d17-877d-b29bf16032b3 -Z

code_quality:
    stage: analysis
    image: docker:stable
    retry: 2
    variables:
        DOCKER_DRIVER: overlay2
    allow_failure: true
    services:
        - docker:stable-dind
    script:
        - export SP_VERSION=$(echo "$CI_SERVER_VERSION" | sed 's/^\([0-9]*\)\.\([0-9]*\).*/\1-\2-stable/')
        - docker run
            --env SOURCE_CODE="$PWD"
            --volume "$PWD":/code
            --volume /var/run/docker.sock:/var/run/docker.sock
            "registry.gitlab.com/gitlab-org/security-products/codequality:$SP_VERSION" /code
    artifacts:
        paths: [gl-code-quality-report.json]
